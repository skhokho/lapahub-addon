name: Addon reliability
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile lapahub/rootfs/app/run.py lapahub/rootfs/app/reliability.py lapahub/rootfs/app/managed_scenes.py
